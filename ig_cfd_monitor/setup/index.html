<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="__CSRF__"><title>Harbour · 本机 IG 连接配置</title><link rel="stylesheet" href="/setup.css"><script defer src="/setup.js"></script></head><body><main><div class="eyebrow">HARBOUR / LOCAL SETUP</div><h1>连接你的 IG 账户</h1><p>这个页面只在当前 Mac 使用，不随公开看板发布。凭据保存在本机权限受限的配置文件中，不会回显或上传 GitHub。</p><form id="setup-form"><label>环境<select name="environment"><option value="live">Live · 真实账户</option><option value="demo">Demo · IG 模拟账户</option></select></label><label>IG API Key<input name="api_key" type="password" autocomplete="off" required maxlength="500"><small>My IG → Settings → API keys。填写与你选择的环境对应的密钥。</small></label><label>IG 用户名 / Identifier<input name="identifier" autocomplete="username" required maxlength="500"><small>用于 IG API 登录的用户名，可能与邮箱不同。</small></label><label>IG 登录密码<input name="password" type="password" autocomplete="current-password" required maxlength="500"><small>密码直接提交给本机服务，再通过 HTTPS 验证 IG 登录。</small></label><label>IG Account ID（可先留空）<input name="account_id" autocomplete="off" maxlength="30"><small>是账户编号，不是用户名。仅一个 HKD CFD 账户时自动选择；有多个时会提示选择。</small></label><label>历史记录起始日<input name="history_since" type="date" value="2026-01-01" required><small>建议不晚于开户日。按月份与分页回补；接口无法提供的历史会标记缺口。</small></label><div class="note">风险基准：初始净投入 HKD 30,000，累计亏损提醒线 60%。保存配置后的额外入金、出金单独调整。不会下单或修改你的交易。</div><button type="submit">保存配置并连接</button><p id="save-result" role="status"></p></form><section><h2>连接状态</h2><div id="connection-status" role="status">正在读取…</div><div id="account-choices"></div></section><p class="footer">公开看板使用 8786；本机配置仅使用 8787。请勿将 8787 设置为 Funnel 目标。</p></main></body></html>
